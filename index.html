<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fridas Leckerli-Jagd 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,Arial;color:white}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{position:absolute;top:14px;padding:9px 14px;border-radius:22px;background:#182025dd;border:2px solid #ffffff70;box-shadow:0 4px 12px #0007;font-weight:800}
#bones{left:14px} #score{right:14px}
#place{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:#6c3c1de8;padding:8px 18px;border:2px solid #d49b5a;border-radius:8px;font-weight:900;box-shadow:0 4px 12px #0006;white-space:nowrap}
#msg{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);background:#171b1ddd;padding:10px 16px;border-radius:16px;border:1px solid #fff6;opacity:0;transition:.25s;white-space:nowrap}
#joy{pointer-events:auto;position:absolute;left:24px;bottom:30px;width:142px;height:142px;border-radius:50%;border:4px solid #ffffffaa;background:#10251bbd;box-shadow:inset 0 0 35px #000,0 6px 16px #0008;touch-action:none}
#knob{position:absolute;width:62px;height:62px;left:36px;top:36px;border-radius:50%;background:linear-gradient(#777,#333);border:3px solid #aaa;box-shadow:0 5px 12px #000}
.actions{position:absolute;right:20px;bottom:35px;display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.btn{width:72px;height:72px;border-radius:50%;border:3px solid #ddd;background:#152019dd;color:#fff;font-size:25px;font-weight:900;box-shadow:0 5px 12px #0008;touch-action:none}
.btn small{display:block;font-size:10px}
#sprint{width:82px;height:82px}
#start{position:fixed;inset:0;z-index:5;background:
linear-gradient(#0002,#0008),
url('5588D0C7-80D2-465F-A405-41856E1DFDD2.jpeg') center/cover no-repeat;
display:flex;align-items:flex-end;justify-content:center;padding:7vh 20px}
.card{width:min(620px,95vw);padding:18px;background:#24180ee8;border:2px solid #e5b25e;border-radius:22px;text-align:center;box-shadow:0 12px 35px #000b}
.card h1{margin:0 0 5px;font-size:clamp(27px,7vw,46px);text-shadow:0 3px 4px #000}
.card p{margin:6px 0 14px}
.choose{display:flex;gap:10px;justify-content:center}
.char{flex:1;max-width:220px;padding:12px;border-radius:15px;border:2px solid #ffffff55;background:#ffffff12;color:#fff;font-weight:800}
.char.on{border-color:#ffd66b;box-shadow:0 0 18px #ffc43d}
.go{margin-top:13px;width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(#25a54d,#08762d);color:#fff;font-size:21px;font-weight:900}
#loading{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:10;font-size:20px}
</style>
</head>
<body>
<div id="loading">3D-Welt wird geladen …</div>
<div id="start">
 <div class="card">
  <h1>🐾 FRIDAS LECKERLI-JAGD</h1>
  <p>Kleine Pfoten. Große Abenteuer. ❤️</p>
  <div class="choose">
   <button class="char on" data-char="frida">🐕 Frida<br><small>Ruhig. Schlau. Ein Herz auf vier Pfoten.</small></button>
   <button class="char" data-char="gina">🐶 Gina<br><small>Neugierig. Mutig. Immer vorne dabei.</small></button>
  </div>
  <button class="go">🐾 Los geht’s!</button>
 </div>
</div>
<div id="hud">
 <div id="bones" class="pill">🦴 <span>0</span>/10</div>
 <div id="score" class="pill">⭐ <span>0</span> ❤️❤️❤️</div>
 <div id="place">📍 Hangelar Ost</div><div id="msg"></div>
 <div id="joy"><div id="knob"></div></div>
 <div class="actions">
  <button id="jump" class="btn">⬆️<small>Springen</small></button>
  <button id="action" class="btn">🐾<small>Aktion</small></button>
  <button id="sprint" class="btn">💨<small>Sprint</small></button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,dog,clock,broccoli,chosen='frida',bones=0,score=0;
let move={x:0,y:0}, sprint=false, vy=0, grounded=true, collectibles=[];
const loading=document.querySelector('#loading'), start=document.querySelector('#start'), msg=document.querySelector('#msg');
function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x78cfff); scene.fog=new THREE.Fog(0x9ed8d0,28,95);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,160);
 renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.body.prepend(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xfff2d0,0x47633b,2.1));
 const sun=new THREE.DirectionalLight(0xffe0a0,3);sun.position.set(-18,28,-12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
 world(); createDog(); controls(); clock=new THREE.Clock(); loading.style.display='none'; animate();
}
function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function mesh(g,m,x,y,z,shadow=true){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=shadow;scene.add(o);return o}
function world(){
 mesh(new THREE.PlaneGeometry(150,150),mat(0x4f9d3b),0,-.03,0).rotation.x=-Math.PI/2;
 const path=mesh(new THREE.PlaneGeometry(7,130),mat(0xc59a5c),0,.01,-25,false);path.rotation.x=-Math.PI/2;
 for(let i=0;i<45;i++){let side=i%2?1:-1,x=side*(5+Math.random()*18),z=15-Math.random()*100;
  let trunk=mesh(new THREE.CylinderGeometry(.25,.38,2.7,8),mat(0x6b3c1e),x,1.3,z);
  let crown=mesh(new THREE.SphereGeometry(1.4+Math.random(),10,8),mat(i%3?0x367b35:0x5b913c),x,3,z);
 }
 // village silhouettes
 for(let i=0;i<12;i++){let x=-24+i*4.4,z=-68-Math.random()*7;
  mesh(new THREE.BoxGeometry(3.3,2.7+Math.random()*2,3.3),mat(i%2?0xf0d0a0:0xd88d62),x,1.4,z);
  let roof=mesh(new THREE.ConeGeometry(2.7,1.8,4),mat(0x8c3c2e),x,3.5,z);roof.rotation.y=Math.PI/4;
 }
 // signs
 sign('Hangelar Ost',-6,-12); sign('Sankt Augustin Ort',6,-42); sign('Mülldorf',-6,-70);
 for(let i=0;i<10;i++){let z=-7-i*8;let b=mesh(new THREE.TorusGeometry(.32,.12,8,14),mat(0xe7c5a0), (i%2?1:-1)*(1+Math.random()*2),.55,z);b.rotation.x=Math.PI/2;collectibles.push(b)}
 // broccoli
 broccoli=new THREE.Group(); let stem=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,2,10),mat(0x65b64b));stem.position.y=1;
 broccoli.add(stem);for(let i=0;i<7;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(.65,10,8),new THREE.MeshStandardMaterial({color:0x49a934,emissive:0x276c15,emissiveIntensity:1.3}));c.position.set((Math.random()-.5)*1.4,2+(Math.random()-.5)*.7,(Math.random()-.5)*1.1);broccoli.add(c)}
 broccoli.position.set(3,0,-56);scene.add(broccoli);
}
function sign(text,x,z){
 let post=mesh(new THREE.BoxGeometry(.18,2.5,.18),mat(0x70401f),x,1.2,z);
 let board=mesh(new THREE.BoxGeometry(4.8,1.25,.22),mat(0x8c5228),x,2.6,z);
 // labels via canvas texture
 let c=document.createElement('canvas');c.width=512;c.height=128;let q=c.getContext('2d');q.fillStyle='#8c5228';q.fillRect(0,0,512,128);q.fillStyle='white';q.font='bold 42px sans-serif';q.textAlign='center';q.fillText(text,256,78);
 let s=new THREE.Mesh(new THREE.PlaneGeometry(4.6,1.1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.position.set(x,2.6,z+.12);scene.add(s)
}
function createDog(){
 dog=new THREE.Group();
 const white=mat(0xf3eee1), dark=mat(0x6b625c), pink=mat(0xb42f67);
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.25,8,12),white);body.rotation.x=Math.PI/2;body.position.y=1.1;dog.add(body);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.62,16,12),white);head.position.set(0,1.65,-.78);dog.add(head);
 let snout=new THREE.Mesh(new THREE.SphereGeometry(.32,12,9),white);snout.scale.set(.75,.65,1.1);snout.position.set(0,1.48,-1.27);dog.add(snout);
 let nose=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),dark);nose.position.set(0,1.52,-1.58);dog.add(nose);
 for(let s of [-1,1]){let ear=new THREE.Mesh(new THREE.ConeGeometry(.28,.95,8),white);ear.position.set(s*.36,2.28,-.75);ear.rotation.z=s*.13;dog.add(ear);
 let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.65,5,8),white);leg.position.set(s*.38,.48,-.42);dog.add(leg);
 let leg2=leg.clone();leg2.position.z=.48;dog.add(leg2)}
 let harness=new THREE.Mesh(new THREE.TorusGeometry(.58,.11,8,20),pink);harness.rotation.x=Math.PI/2;harness.position.set(0,1.12,-.2);dog.add(harness);
 dog.position.set(0,0,5);scene.add(dog);
}
function ginaLook(){
 dog.children.forEach((o,i)=>{if(o.material&&i!==8)o.material=o.material.clone()});
 if(chosen==='gina'){dog.scale.set(.78,.78,.78);dog.children[0].material=mat(0xe8e3da);dog.children[1].material=mat(0xd9d5cf);dog.children[3].material=mat(0x66605e)}
}
function controls(){
 document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('on'));b.classList.add('on');chosen=b.dataset.char});
 document.querySelector('.go').onclick=()=>{ginaLook();start.style.display='none'};
 const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
 function set(e){let r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),d=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);move.x=Math.cos(a)*d/48;move.y=Math.sin(a)*d/48;knob.style.transform=`translate(${move.x*48}px,${move.y*48}px)`}
 joy.addEventListener('touchstart',set);joy.addEventListener('touchmove',e=>{e.preventDefault();set(e)},{passive:false});joy.addEventListener('touchend',()=>{move.x=move.y=0;knob.style.transform=''});
 document.querySelector('#sprint').ontouchstart=()=>sprint=true;document.querySelector('#sprint').ontouchend=()=>sprint=false;
 document.querySelector('#jump').onclick=()=>{if(grounded){vy=.14;grounded=false}};
 document.querySelector('#action').onclick=()=>toast('🐾 Frida schnuppert nach Geheimnissen …');
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
}
function toast(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>msg.style.opacity=0,1800)}
function animate(){
 requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.033);
 if(start.style.display==='none'){
  let speed=(sprint?9:5)*dt; dog.position.x+=move.x*speed;dog.position.z+=move.y*speed;
  dog.position.x=THREE.MathUtils.clamp(dog.position.x,-3.1,3.1);
  if(Math.abs(move.x)+Math.abs(move.y)>.05){dog.rotation.y=Math.atan2(-move.x,-move.y);dog.position.y+=Math.sin(performance.now()*.012)*.004}
  if(!grounded){dog.position.y+=vy;vy-=.008;if(dog.position.y<=0){dog.position.y=0;grounded=true}}
  let target=new THREE.Vector3(dog.position.x*.45,4.2,dog.position.z+7.2);camera.position.lerp(target,.08);camera.lookAt(dog.position.x,1.1,dog.position.z-5);
  collectibles.forEach(c=>{c.rotation.z+=dt*2;if(c.visible&&c.position.distanceTo(dog.position)<1.3){c.visible=false;bones++;score+=100;document.querySelector('#bones span').textContent=bones;document.querySelector('#score span').textContent=score;toast('🦴 Leckerli gefunden! +100')}})
  broccoli.rotation.y+=dt*.8;if(broccoli.visible&&broccoli.position.distanceTo(dog.position)<2){broccoli.visible=false;score+=500;document.querySelector('#score span').textContent=score;toast('✨ MAGISCHER BROCCOLI! Neuer Weg freigeschaltet! ✨')}
  let z=dog.position.z, place=z>-25?'Hangelar Ost':z>-58?'Sankt Augustin Ort':'Mülldorf';document.querySelector('#place').textContent='📍 '+place;
 }
 renderer.render(scene,camera)
}
init();
</script>
</body>
</html>
