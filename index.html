const keys={}; let frida,treats,broccoli,obstacles,score,won;
const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){
 frida={x:70,y:245,w:66,h:92,s:4.2};score=0;won=false;
 treats=Array.from({length:8},()=>({x:rand(150,835),y:rand(90,500),r:15,taken:false}));
 broccoli={x:rand(300,810),y:rand(100,470),r:24,taken:false};
 obstacles=[{x:260,y:145,w:95,h:55,type:'bush'},{x:510,y:330,w:110,h:55,type:'puddle'},{x:690,y:130,w:75,h:70,type:'rock'}];
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function circleHit(a,o){let cx=Math.max(a.x,Math.min(o.x,a.x+a.w)),cy=Math.max(a.y,Math.min(o.y,a.y+a.h));return (cx-o.x)**2+(cy-o.y)**2<o.r**2}
function move(){
 if(won)return;let ox=frida.x,oy=frida.y;
 if(keys.ArrowLeft||keys.a)frida.x-=frida.s;if(keys.ArrowRight||keys.d)frida.x+=frida.s;
 if(keys.ArrowUp||keys.w)frida.y-=frida.s;if(keys.ArrowDown||keys.s)frida.y+=frida.s;
 frida.x=Math.max(0,Math.min(900-frida.w,frida.x));frida.y=Math.max(45,Math.min(560-frida.h,frida.y));
 for(const o of obstacles)if(hit(frida,o)){frida.x=ox;frida.y=oy}
 for(const t of treats)if(!t.taken&&circleHit(frida,t)){t.taken=true;score+=10}
 if(!broccoli.taken&&circleHit(frida,broccoli)){broccoli.taken=true;score+=50}
 if(treats.every(t=>t.taken))won=true;
}
function bone(t){x.save();x.translate(t.x,t.y);x.fillStyle='#e9b66d';x.strokeStyle='#9b6735';x.lineWidth=3;x.beginPath();x.arc(-12,-7,7,0,7);x.arc(-12,7,7,0,7);x.arc(12,-7,7,0,7);x.arc(12,7,7,0,7);x.fill();x.fillRect(-13,-7,26,14);x.stroke();x.restore()}
function drawBroccoli(){if(broccoli.taken)return;x.fillStyle='#79a93b';x.fillRect(broccoli.x-7,broccoli.y,14,26);x.fillStyle='#5d8e31';for(const q of [[0,-7,16],[-13,-2,12],[13,-2,12],[-7,-16,11],[8,-17,11]]){x.beginPath();x.arc(broccoli.x+q[0],broccoli.y+q[1],q[2],0,7);x.fill()}}
function obstacle(o){if(o.type==='bush'){x.fillStyle='#548d3c';for(let i=0;i<6;i++){x.beginPath();x.arc(o.x+15+i*14,o.y+30-(i%2)*12,25,0,7);x.fill()}}if(o.type==='puddle'){x.fillStyle='#75bde2';x.beginPath();x.ellipse(o.x+55,o.y+28,55,27,0,0,7);x.fill()}if(o.type==='rock'){x.fillStyle='#777';x.beginPath();x.roundRect(o.x,o.y+10,o.w,o.h-10,25);x.fill()}}
function draw(){
 let g=x.createLinearGradient(0,0,0,560);g.addColorStop(0,'#9fd7f1');g.addColorStop(.28,'#dff0bd');g.addColorStop(.29,'#8dc75f');g.addColorStop(1,'#aed879');x.fillStyle=g;x.fillRect(0,0,900,560);
 for(let i=0;i<35;i++){let fx=(i*83)%900,fy=390+(i*47)%160;x.fillStyle=i%2?'#fff7d6':'#f4a7b9';x.beginPath();x.arc(fx,fy,3,0,7);x.fill()}
 x.fillStyle='#ffffffdd';x.fillRect(0,0,900,45);x.fillStyle='#33402e';x.font='bold 21px system-ui';x.fillText('Punkte: '+score,20,30);x.fillText('Leckerlis: '+treats.filter(t=>t.taken).length+'/8',180,30);
 obstacles.forEach(obstacle);treats.forEach(t=>{if(!t.taken)bone(t)});drawBroccoli();
 if(img.complete)x.drawImage(img,frida.x,frida.y,frida.w,frida.h);
 if(won){x.fillStyle='#26321ddd';x.fillRect(0,0,900,560);x.textAlign='center';x.fillStyle='white';x.font='bold 43px system-ui';x.fillText('Frida hat alle Leckerlis! 🐾',450,235);x.font='27px system-ui';x.fillText('Punktestand: '+score,450,285);x.font='20px system-ui';x.fillText('Tippe auf „Neu starten“ für noch eine Runde.',450,330);x.textAlign='left'}
}
function loop(){move();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;let on=e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed')};let off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
document.getElementById('restart').onclick=reset;reset();loop();
</script>
